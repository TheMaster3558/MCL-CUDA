<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">CUDA Particle Filter</title>
  <desc id="desc">A GPU particle filter estimates a moving point from noisy ranges to three beacons. The diagram shows a circular trajectory, beacon locations, and a cloud of candidate particles.</desc>
  <rect width="1200" height="400" rx="18" fill="#F4F3EE"/>
  <path d="M0 18Q0 0 18 0H1182Q1200 0 1200 18V382Q1200 400 1182 400H18Q0 400 0 382Z" fill="#F4F3EE" stroke="#D7D6D0" stroke-width="2"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#17191B">
    <text x="64" y="68" font-size="18" font-weight="700" letter-spacing="2.4" fill="#2A5D8F">CUDA / SEQUENTIAL MONTE CARLO</text>
    <text x="60" y="150" font-size="58" font-weight="720" letter-spacing="-2">CUDA Particle</text>
    <text x="60" y="216" font-size="58" font-weight="720" letter-spacing="-2">Filter</text>
    <text x="64" y="264" font-size="22" fill="#4D5051">GPU position estimation from noisy beacon ranges.</text>
    <line x1="64" y1="298" x2="645" y2="298" stroke="#CBCAC3" stroke-width="2"/>
    <text x="64" y="346" font-size="34" font-weight="700" fill="#2A5D8F">702.73M</text>
    <text x="219" y="342" font-size="19" font-weight="650">particle updates / second</text>
    <text x="219" y="367" font-size="17" fill="#666967">Peak recorded throughput · 1,048,576 particles</text>
  </g>
  <g transform="translate(700 32)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <rect x="0" y="0" width="450" height="336" rx="12" fill="#ECEBE5" stroke="#D7D6D0" stroke-width="2"/>
