      <path d="M32 72H418M32 132H418M32 192H418M32 252H418"/>
      <path d="M82 32V304M142 32V304M202 32V304M262 32V304M322 32V304M382 32V304"/>
    </g>
    <path d="M99 223 A128 128 0 1 1 355 223 A128 128 0 1 1 99 223" fill="none" stroke="#2A5D8F" stroke-width="3" stroke-dasharray="9 8" opacity=".72"/>
    <path d="M99 223L220 98M355 223L220 98M225 288L220 98" fill="none" stroke="#B9784F" stroke-width="2" stroke-dasharray="5 6" opacity=".56"/>
    <g fill="#2A5D8F" opacity=".78">
      <circle cx="300" cy="186" r="5"/><circle cx="309" cy="194" r="4"/><circle cx="319" cy="181" r="5"/><circle cx="326" cy="198" r="4"/>
      <circle cx="291" cy="202" r="4"/><circle cx="303" cy="211" r="4"/><circle cx="314" cy="207" r="5"/><circle cx="333" cy="187" r="4"/>
      <circle cx="323" cy="217" r="4"/><circle cx="337" cy="205" r="4"/><circle cx="296" cy="176" r="4"/><circle cx="312" cy="169" r="4"/>
      <circle cx="341" cy="219" r="4"/><circle cx="281" cy="190" r="4"/><circle cx="328" cy="174" r="4"/><circle cx="304" cy="225" r="4"/>
      <circle cx="348" cy="193" r="4"/><circle cx="288" cy="215" r="4"/><circle cx="318" cy="229" r="4"/><circle cx="337" cy="168" r="4"/>
    </g>
    <circle cx="318" cy="198" r="9" fill="#17191B" stroke="#F4F3EE" stroke-width="3"/>
    <g fill="#E17A35" stroke="#F4F3EE" stroke-width="3">
      <path d="M220 82l12 21h-24z"/><path d="M99 207l12 21H87z"/><path d="M355 207l12 21h-24z"/>
